logLevel: warn
logDestinations: [stdout]

api: true
apiAddress: :9997
metrics: true
metricsAddress: :9998

rtsp: true
rtspAddress: :8554
rtmp: true
rtmpAddress: :1935
# HLS / SRT / playback are unused by this load-test tool (WebRTC only).
# Disabling them frees CPU/RAM so 100 live WebRTC views stay smooth.
hls: false
hlsAddress: :8888
srt: false
srtAddress: :8890

webrtc: true
webrtcAddress: :8889
# Explicit UDP port for WebRTC media (published in docker-compose.yml)
webrtcLocalUDPAddress: :8189

# Avoid port conflict with FastAPI backend (port 8000).
rtpAddress: :8002
rtcpAddress: :8003

# MediaMTX 1.19 default auth only allows the API/metrics/pprof from
# 127.0.0.1/::1 INSIDE the container. Both the backend container
# (http://mediamtx:9997) and host curl (via port mapping) come from other IPs,
# so without this block every API call fails with "authentication error" and
# camera paths are never registered ("stream not found" in the UI).
# Lab setup: allow anonymous access from any IP. Restrict for production.
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api
      - action: metrics
      - action: pprof

pathDefaults:
  record: false
  recordPath: ./recordings/%path/%Y-%m-%d_%H-%M-%S-%f

paths:
  all_others: {}
