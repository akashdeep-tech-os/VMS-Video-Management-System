# SURAKSHIT VMS frontend — static SPA + reverse proxy to the backend.
# Placed at /etc/nginx/conf.d/default.conf (included inside nginx's http{} block,
# so the map below is valid here).

# WebSocket upgrade support for proxied endpoints.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # Fingerprinted build assets can be cached hard (Vite hashes filenames).
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: unknown paths serve index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to the backend container.
    #
    # IMPORTANT: the backend serves under /api/v1, and proxy_pass here has NO
    # trailing slash / path — so the FULL request URI is forwarded unchanged
    # (/api/v1/... -> http://edge-server:8080/api/v1/...). Do NOT add a trailing
    # slash to proxy_pass or nginx will strip /api and every call will 404.
    location /api/ {
        proxy_pass http://edge-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    # Backend health WebSocket (optional — only used if the UI subscribes to it).
    location /ws/ {
        proxy_pass http://edge-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # NOTE: live-stream URLs (WebRTC/HLS) returned by the backend point directly
    # at MediaMTX / camera IPs and are reached by the browser directly — they do
    # NOT pass through this proxy.
}
